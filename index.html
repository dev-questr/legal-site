<title>Questr — Level up your life. And a cow.</title>

<meta property="og:title" content="Questr — Level up your life. And a cow."/>
<meta property="og:description" content="Take on real-life side quests, earn XP, grow your cow, and post the best ones."/>

<style>
  *{box-sizing:border-box}
  :root{
    color-scheme:light;
    --cream:#F5F1E6;--card:#FFFFFF;--ink:#4A2E1E;
    --ink-muted:rgba(74,46,30,.62);--ink-faint:rgba(74,46,30,.40);
    --orange:#F96E11;--orange-deep:#C75B23;
    --pink:#E89AAE;--blue:#6E97C4;--green:#5BB97A;--yellow:#F2B705;
    --border:rgba(74,46,30,.10);
  }
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%,rgba(255,255,255,.9),transparent 60%),
      var(--cream);
    color:var(--ink);
    font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-weight:500;-webkit-font-smoothing:antialiased;overflow:hidden;
  }
  .stage{
    position:relative;height:100vh;height:100svh;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(6px,1.6vh,16px);
    padding:max(18px,env(safe-area-inset-top)) 22px max(14px,env(safe-area-inset-bottom)) 22px;
  }
  /* Ambient drifting confetti — decorative only */
  .sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .p{position:absolute;width:var(--s);height:var(--s);opacity:.5;
     animation:drift var(--dur) ease-in-out var(--d) infinite;will-change:transform}
  .p.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD36B,var(--yellow) 55%,var(--orange));
          box-shadow:0 4px 10px rgba(249,110,17,.28)}
  .p.coin.sm{opacity:.42}
  .p.spark{transform:rotate(45deg);border-radius:2px;opacity:.55}
  .p.spark.pink{background:var(--pink)}.p.spark.blue{background:var(--blue)}.p.spark.green{background:var(--green)}
  @keyframes drift{
    0%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-22px) rotate(12deg)}
    100%{transform:translateY(0) rotate(0)}
  }
  /* Wordmark */
  .brand{flex:0 0 auto;z-index:2}
  .logo{width:clamp(104px,26vw,150px);height:auto;display:block}
  /* Hero: the blinking bucket-hat cow */
  .hero{position:relative;flex:1 1 0;min-height:0;width:100%;z-index:1;
        display:flex;flex-direction:column;align-items:center;justify-content:center}
  .cow-wrap{position:relative;flex:1 1 0;min-height:0;width:100%;
            display:flex;align-items:center;justify-content:center;isolation:isolate}
  /* Figure hugs the cow so the ground shadow tracks it on every layout */
  .cow-fig{position:relative;display:flex;align-items:flex-end;justify-content:center;
           max-width:100%;max-height:100%}
  /* Warm glow anchored behind the cow */
  .cow-fig::before{
    content:"";position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    width:min(128vw,600px);aspect-ratio:1;z-index:-1;pointer-events:none;
    background:radial-gradient(closest-side,rgba(249,110,17,.20),rgba(249,110,17,.08) 46%,transparent 72%);
  }
  .cow{
    max-width:100%;max-height:100%;width:min(74vw,440px);height:auto;object-fit:contain;
    filter:drop-shadow(0 24px 34px rgba(74,46,30,.20));
    animation:bob 6s ease-in-out infinite;will-change:transform;
  }
  /* Soft elliptical ground shadow beneath the cow. The art's feet sit ~3.2% of
     the image width right of centre (the hat/head balance the full-figure
     centroid), so the shadow is offset to 53.2% to sit under the feet, not the
     silhouette centre. Percentage-based → self-corrects at every render size. */
  .cow-ground{
    position:absolute;left:53.2%;bottom:-4px;transform:translateX(-50%);
    width:66%;max-width:240px;height:clamp(12px,2.4vh,22px);z-index:-1;
    background:radial-gradient(closest-side,rgba(74,46,30,.20),transparent 72%);
    animation:squish 6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes squish{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.9}50%{transform:translateX(-50%) scaleX(.88);opacity:.6}}
  /* Copy block */
  .copy{flex:0 0 auto;z-index:2;text-align:center;max-width:min(92vw,560px)}
  .headline{margin:0;font-weight:800;letter-spacing:-.03em;line-height:1.05;
            font-size:clamp(28px,6.4vw,52px)}
  .headline .hl{color:var(--orange)}
  .sub{margin:.7em auto 0;max-width:34ch;font-size:clamp(14px,2vw,19px);
       font-weight:500;color:var(--ink-muted);line-height:1.45}
  /* CTA buttons */
  .cta{flex:0 0 auto;z-index:2;width:100%;max-width:380px;display:flex;flex-direction:column;gap:11px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    height:clamp(52px,7vh,60px);border-radius:999px;width:100%;
    font-size:clamp(15px,1.7vw,17px);font-weight:700;text-decoration:none;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,background .2s ease;
  }
  .btn svg{width:19px;height:19px;flex:0 0 auto}
  .btn:hover{transform:scale(1.03)}
  .btn:active{transform:scale(.96)}
  .btn-primary{background:var(--orange);color:#fff;box-shadow:0 12px 26px rgba(249,110,17,.34)}
  .btn-primary:hover{box-shadow:0 16px 34px rgba(249,110,17,.44)}
  .btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--border);
                 box-shadow:0 8px 20px rgba(74,46,30,.10)}
  .btn-secondary:hover{background:#FFFDF8}
  .btn-secondary svg{color:#5865F2}
  /* Footer small print */
  .legal{flex:0 0 auto;z-index:2;width:100%;text-align:center;
         font-size:clamp(11px,1.3vw,13px);color:var(--ink-faint);padding-top:4px}
  .legal a{color:var(--ink-muted);text-decoration:none;font-weight:600}
  .legal a:hover{color:var(--orange)}
  .legal .sep{margin:0 7px;opacity:.4}
  /* Desktop: two-column — cow left, copy + CTA right */
  @media (min-width:901px){
    .stage{
      display:grid;
      grid-template-columns:1.02fr .98fr;
      grid-template-rows:1fr auto auto auto 1fr min-content;
      grid-template-areas:"hero brand" "hero copy" "hero cta" "hero ." "hero ." "footer footer";
      column-gap:clamp(28px,5vw,84px);align-items:center;
      padding:36px clamp(40px,6vw,110px);
    }
    .hero{grid-area:hero;align-self:stretch;min-height:0}
    .brand{grid-area:brand;align-self:end;justify-self:start;margin-bottom:8px}
    .copy{grid-area:copy;text-align:left;align-self:start;justify-self:start;margin:0}
    .copy .sub{margin-left:0}
    .cta{grid-area:cta;align-self:start;justify-self:start;max-width:380px;margin-top:18px}
    .legal{grid-area:footer}
  }
  /* Squashed landscape phones: two-column fallback */
  @media (orientation:landscape) and (max-height:520px){
    .stage{
      display:grid;grid-template-columns:1.05fr .95fr;
      grid-template-rows:auto 1fr auto min-content;
      grid-template-areas:"hero brand" "hero copy" "hero cta" "footer footer";
      column-gap:4vw;align-items:center;padding:14px 4vw;
    }
    .hero{grid-area:hero;align-self:stretch;min-height:0}
    .brand{grid-area:brand;justify-self:start}
    .copy{grid-area:copy;text-align:left;justify-self:start}
    .headline{font-size:clamp(20px,4.4vw,32px)}
    .cta{grid-area:cta;justify-self:start;max-width:320px}.legal{grid-area:footer}
  }
  /* Phones only — tighten so everything stays above the fold */
  @media (max-width:600px){
    .stage{gap:6px;padding-left:18px;padding-right:18px}
    .logo{width:clamp(94px,25vw,124px)}
    .cow{width:min(78vw,360px)}
    .sub{margin-top:.55em}
    .cta{gap:9px}
    .btn{height:clamp(50px,6.6vh,56px)}
  }
  @media (prefers-reduced-motion:reduce){
    .cow,.cow-ground,.p{animation:none}
  }
</style></head>
